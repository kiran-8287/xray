*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.root{padding:1rem 0}
.search-bar{display:flex;align-items:center;gap:8px;margin-bottom:1.5rem;padding:0 0.25rem}
.search-bar input{flex:1;font-size:14px}
.search-bar span{font-size:13px;color:var(--color-text-secondary);white-space:nowrap}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.cat-btn{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;text-align:left;transition:all 0.15s;display:flex;align-items:center;gap:8px}
.cat-btn:hover{background:var(--color-background-primary);border-color:var(--color-border-secondary)}
.cat-btn.active{border-color:var(--color-border-primary);background:var(--color-background-primary)}
.cat-btn .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-btn span{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.cat-btn small{font-size:11px;color:var(--color-text-secondary);display:block;margin-top:1px}
.main-area{display:grid;grid-template-columns:220px 1fr;gap:16px;min-height:420px}
.sidebar{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.sb-item{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;transition:background 0.1s}
.sb-item:last-child{border-bottom:none}
.sb-item:hover{background:var(--color-background-secondary)}
.sb-item.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.sb-item .cnt{font-size:11px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:99px;padding:1px 7px;color:var(--color-text-secondary)}
.sb-item.active .cnt{background:var(--color-background-primary)}
.detail{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-primary);padding:16px;overflow-y:auto;max-height:520px}
.detail h2{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.detail .desc{font-size:13px;color:var(--color-text-secondary);margin-bottom:14px;line-height:1.5}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.item-card{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 11px}
.item-card .name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.item-card .meta{font-size:11px;color:var(--color-text-secondary);margin-top:2px;line-height:1.4}
.empty{color:var(--color-text-secondary);font-size:14px;padding:2rem;text-align:center}
.no-res{color:var(--color-text-secondary);font-size:14px;text-align:center;padding:3rem 1rem}
.search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sr-card{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 11px}
.sr-card .sname{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.sr-card .spath{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;margin-bottom:10px;font-weight:500}
</style>

let activeCat = "bags";
let activeSub = null;
let searchMode = false;

const catGrid = document.getElementById("catGrid");
const sidebar = document.getElementById("sidebar");
const detail = document.getElementById("detail");
const searchInput = document.getElementById("search");
const resCount = document.getElementById("res-count");
const mainView = document.getElementById("mainView");
const searchView = document.getElementById("searchView");
const searchResults = document.getElementById("searchResults");

function totalItems(cat){
  return Object.values(cat.subs).reduce((s,sub)=>s+sub.items.length,0);
}

function renderCatGrid(){
  catGrid.innerHTML = "";
  Object.entries(DATA).forEach(([key,cat])=>{
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (key===activeCat&&!searchMode?" active":"");
    btn.innerHTML = `<div class="dot" style="background:${cat.color}"></div><div><span>${cat.label}</span><small>${totalItems(cat)} items</small></div>`;
    btn.onclick = ()=>{
      activeCat=key; activeSub=null; searchMode=false;
      searchInput.value=""; resCount.textContent="";
      mainView.style.display="grid"; searchView.style.display="none";
      renderCatGrid(); renderSidebar(); renderDetail();
    };
    catGrid.appendChild(btn);
  });
}

function renderSidebar(){
  sidebar.innerHTML = "";
  const cat = DATA[activeCat];
  Object.entries(cat.subs).forEach(([name,sub])=>{
    const div = document.createElement("div");
    div.className = "sb-item" + (name===activeSub?" active":"");
    div.innerHTML = `<span>${name}</span><span class="cnt">${sub.items.length}</span>`;
    div.onclick = ()=>{ activeSub=name; renderSidebar(); renderDetail(); };
    sidebar.appendChild(div);
  });
}

function renderDetail(){
  if(!activeSub){ detail.innerHTML = '<div class="empty">Select a subcategory →</div>'; return; }
  const sub = DATA[activeCat].subs[activeSub];
  const cat = DATA[activeCat];
  const badge = `<span class="badge" style="background:${cat.color}20;color:${cat.color};border:0.5px solid ${cat.color}40">${cat.label} / ${activeSub}</span>`;
  detail.innerHTML = `${badge}<h2>${activeSub}</h2><p class="desc">${sub.desc}</p><div class="items-grid">${sub.items.map(i=>`<div class="item-card"><div class="name">${i.name}</div><div class="meta">${i.meta}</div></div>`).join("")}</div>`;
}

function doSearch(q){
  if(!q){
    searchMode=false; mainView.style.display="grid"; searchView.style.display="none";
    resCount.textContent=""; renderCatGrid(); return;
  }
  searchMode=true; mainView.style.display="none"; searchView.style.display="block";
  const ql = q.toLowerCase();
  const hits = [];
  Object.entries(DATA).forEach(([catKey,cat])=>{
    Object.entries(cat.subs).forEach(([subName,sub])=>{
      sub.items.forEach(item=>{
        if(item.name.toLowerCase().includes(ql)||item.meta.toLowerCase().includes(ql)||subName.toLowerCase().includes(ql)||cat.label.toLowerCase().includes(ql)){
          hits.push({cat,catKey,subName,item});
        }
      });
    });
  });
  resCount.textContent = `${hits.length} result${hits.length!==1?"s":""}`;
  if(!hits.length){ searchResults.innerHTML=`<div class="no-res">No objects found for "${q}"</div>`; return; }
  renderCatGrid();
  searchResults.innerHTML = `<div class="search-results">${hits.map(h=>`<div class="sr-card"><div class="sname">${h.item.name}</div><div class="spath" style="color:${h.cat.color}">${h.cat.label} › ${h.subName}</div><div class="spath">${h.item.meta}</div></div>`).join("")}</div>`;
}

searchInput.addEventListener("input", e=>doSearch(e.target.value.trim()));

renderCatGrid();
activeSub = Object.keys(DATA[activeCat].subs)[0];
renderSidebar();
renderDetail();
</script>
