services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Run the backend as YOUR host uid/gid so files written into the bind-mounted
      # /app/data are owned by you and can be deleted WITHOUT sudo. Set these to
      # $(id -u) / $(id -g) on Linux/macOS; bootstrap.sh does that automatically.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/items/categorized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env.docker
    restart: unless-stopped
