services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Run the container as the host user (defaults to uid/gid 1000) instead of
    # root. Without this, every file the app writes into the bind-mounted
    # ./backend/data is owned by root and shows a "locked / read-only" (red
    # lock) state for normal users, who then can't create/delete/rename files.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/items/categorized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env.docker
    restart: unless-stopped
