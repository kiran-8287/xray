  </defs>

  <rect width="720" height="380" fill="url(#bgGrad)" rx="12" stroke="#334155" stroke-width="1.5" />

  <text x="90" y="32" fill="#f8fafc" font-size="17" font-weight="700" font-family="system-ui, sans-serif">Collage Page — Layout Save Throughput</text>
  <text x="90" y="50" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Combinatorial layouts saved per second through disk queue</text>

  <!-- Y Axis Grid -->
  <line x1="90" y1="60" x2="90" y2="310" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="310" x2="680" y2="310" stroke="#475569" stroke-width="1.5" />

  <!-- Y axis label -->
  <text transform="rotate(-90)" x="-185" y="25" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Throughput (layouts/sec)</text>
  <text x="385" y="365" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Scale (Combinations)</text>

  
